---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel8:2.18

dependencies:
  python_interpreter:
    python_path: /usr/bin/python3.11

  galaxy:
    collections:
      - name: ansible.posix
        version: "1.0.0"
        type: galaxy
        source: https://galaxy.ansible.com
      - name: cisco.ios
        version: "1.0.0"

options:
  package_manager_path: /usr/bin/microdnf
